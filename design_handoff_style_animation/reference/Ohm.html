<script type="text/babel" data-presets="react">
// variations.jsx — four hero/timeline takes, one per vibe.
// Each <Variation*> renders inside a fixed-size DCArtboard (520x780 by default).
// They MUST be internally scrollable (overflow-y:auto) and scope their own
// scroll-driven animations to the local container.

const { useEffect: _vEf, useRef: _vRf, useState: _vSt } = React;
const _OHM = window.OHM;

// ─── tiny helpers ───────────────────────────────────────────────────────────
// IntersectionObserver is unreliable inside the DesignCanvas's transform: scale
// viewport — its computed intersection vs. the page viewport doesn't match the
// scroll-root. We use a rect-vs-rect comparison driven by the artboard's own
// scroll events, plus an initial tick so first-paint elements get marked in.
function _checkInView(el, root, threshold = 0.18) {
  if (!el || !root) return false;
  const er = el.getBoundingClientRect();
  const rr = root.getBoundingClientRect();
  const top = Math.max(er.top, rr.top);
  const bot = Math.min(er.bottom, rr.bottom);
  const visible = Math.max(0, bot - top);
  return visible > 0 && (visible / er.height) >= threshold;
}
function useInView(opts = {}) {
  const ref = React.useRef(null);
  const [seen, setSeen] = React.useState(false);
  React.useEffect(() => {
    const el = ref.current; if (!el) return;
    const root = el.closest('[data-scroll-root]'); if (!root) return;
    const th = opts.threshold ?? 0.12;
    let stopped = false;
    const check = () => {
      if (stopped) return;
      if (_checkInView(el, root, th)) { setSeen(true); cleanup(); }
    };
    const cleanup = () => { stopped = true; root.removeEventListener('scroll', check); };
    root.addEventListener('scroll', check, { passive: true });
    // initial pass + a couple of follow-ups in case layout settles late
    check();
    const t1 = setTimeout(check, 60);
    const t2 = setTimeout(check, 240);
    return () => { cleanup(); clearTimeout(t1); clearTimeout(t2); };
  }, []);
  return [ref, seen];
}

function useStaggeredIn(count, opts = {}) {
  const ref = React.useRef(null);
  const [n, setN] = React.useState(0);
  React.useEffect(() => {
    const el = ref.current; if (!el) return;
    const root = el.closest('[data-scroll-root]'); if (!root) return;
    let stopped = false;
    const fire = () => {
      if (stopped) return;
      if (!_checkInView(el, root, 0.1)) return;
      stopped = true;
      root.removeEventListener('scroll', fire);
      let i = 0;
      const step = () => {
        setN(++i);
        if (i < count) setTimeout(step, (opts.step ?? 40) / (window.__SPD__ || 1));
      };
      step();
    };
    root.addEventListener('scroll', fire, { passive: true });
    fire();
    const t1 = setTimeout(fire, 80);
    const t2 = setTimeout(fire, 280);
    return () => { stopped = true; root.removeEventListener('scroll', fire); clearTimeout(t1); clearTimeout(t2); };
  }, [count]);
  return [ref, n];
}

// Typewriter — types `text` once when in view, with caret.
function Typewriter({ text, speed = 28, startDelay = 0, caret = true, onDone, style }) {
  const [ref, seen] = useInView();
  const [out, setOut] = React.useState('');
  const [done, setDone] = React.useState(false);
  React.useEffect(() => {
    if (!seen) return;
    let i = 0; let cancelled = false;
    const start = () => {
      const tick = () => {
        if (cancelled) return;
        i++; setOut(text.slice(0, i));
        if (i < text.length) setTimeout(tick, speed / (window.__SPD__ || 1));
        else { setDone(true); onDone && onDone(); }
      };
      tick();
    };
    const t = setTimeout(start, startDelay / (window.__SPD__ || 1));
    return () => { cancelled = true; clearTimeout(t); };
  }, [seen, text]);
  return (
    <span ref={ref} style={style}>
      {out}
      {caret && !done && <span className="tw-caret">▍</span>}
    </span>
  );
}

// ─── Shared artboard chrome (header / nav / footer) ─────────────────────────
function PageShell({ children, vibe, themeOverride }) {
  return (
    <div data-scroll-root data-vibe={vibe} className={`shell shell-${vibe}`}
         style={{ width: '100%', height: '100%', overflowY: 'auto', overflowX: 'hidden',

}

function BootSequence() {

    const ts = [400, 800, 600, 400, 600];
    let i = 0;
    const tick = () => {
      i++; setStage(i);
      if (i < ts.length) setTimeout(tick, ts[i - 1] / (window.__SPD__ || 1));
    };
    setTimeout(tick, ts[0] / (window.__SPD__ || 1));
  }, []);
  return (
    <>
      <div style={{ marginTop: 6 }}>
        <span className="ok">patchamet · ohm · Ω · fullstack-developer</span>
      </div>
      {stage >= 1 && (
        <div style={{ marginTop: 14 }}>

        </div>

{`# Ohm

${_OHM.about.split('. ').map(s => '> ' + s.trim()).join('.\n')}`}

        </div>
      )}

          <div><span className="prompt">guest@ohm:~$ </span><Typewriter text="git log --oneline --decorate" speed={22} /></div>

            </div>

          </div>
        </div>
      )}
    </>
  );

function CommitLine({ item, idx }) {
  const [ref, seen] = useInView();
  const hash = (Math.abs(item.year.charCodeAt(0) * 137 + idx * 9001) % 0xfffff).toString(16).padStart(7,'0');
  return (
    <div ref={ref} className={`commit reveal ${seen ? 'in':''}`}
         style={{ display:'grid', gridTemplateColumns:'70px 80px 1fr', gap:8, padding:'2px 4px', borderRadius:2,
                  transitionDelay:`${idx*40}ms` }}>
      <span style={{ color:'var(--ink-3)' }}>{hash}</span>
      <span style={{ color:'var(--ink-2)' }}>({item.year})</span>
      <span><span style={{color:'var(--ink)'}}>{item.title.toLowerCase()}</span> <span style={{color:'var(--ink-3)'}}>— {item.org}</span></span>
    </div>
  );

function MagneticButton({ children, href, secondary }) {
  const ref = React.useRef(null);
  const onMove = (e) => {
    const el = ref.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left - r.width/2) * 0.35;
    const y = (e.clientY - r.top - r.height/2) * 0.35;
    el.style.transform = `translate(${x}px, ${y}px)`;
  };
  const reset = () => { if (ref.current) ref.current.style.transform = ''; };
  return (
    <a ref={ref} href={href} className="magnet"
       onMouseMove={onMove} onMouseLeave={reset}
       data-cursor-target
       style={{
         padding:'12px 22px', borderRadius: 999,
         border:'1px solid var(--ink)',
         background: secondary ? 'transparent' : 'var(--ink)',
         color: secondary ? 'var(--ink)' : 'var(--bg)',
         fontFamily:'var(--mono)', fontSize: 12, letterSpacing:'.04em',
         textDecoration:'none',
       }}>
      {children}
    </a>
  );
}

// PromptLine — types text with caret. Once mounted, plays once.
function PromptLine({ text, speed = 22, startDelay = 0, caretAfter = true }) {
  const [out, setOut] = React.useState('');
  const [done, setDone] = React.useState(false);
  React.useEffect(() => {
    let cancelled = false;
    const m = window.__SPD__ || 1;
    let i = 0;
    const tick = () => {
      if (cancelled) return;
      i++; setOut(text.slice(0, i));
      if (i < text.length) setTimeout(tick, speed/m);
      else setDone(true);
    };
    const t = setTimeout(tick, startDelay/m);
    return () => { cancelled = true; clearTimeout(t); };
  }, []);
  return (
    <span>{out}{caretAfter && !done && <span className="tw-caret">▍</span>}</span>
  );
}

// PromptOnView — types text when its container scrolls into view.
function PromptOnView({ text, speed = 8 }) {
  const [ref, seen] = useInView({ threshold: 0.05 });
  const [out, setOut] = React.useState('');
  const [done, setDone] = React.useState(false);
  React.useEffect(() => {
    if (!seen) return;
    let cancelled = false;
    const m = window.__SPD__ || 1;
    let i = 0;
    const tick = () => {
      if (cancelled) return;
      i++; setOut(text.slice(0, i));
      if (i < text.length) setTimeout(tick, speed/m);
      else setDone(true);
    };
    tick();
    return () => { cancelled = true; };
  }, [seen]);
  return <span ref={ref}>{out}{!done && seen && <span className="tw-caret">▍</span>}</span>;
}

// ─── Reveal observer — adds .in to .reveal as they enter root viewport ──────
function RevealObserver({ root }) {
  React.useEffect(() => {
    const scope = document.querySelector(`.shell-${root}`);
    if (!scope) return;
    let stopped = false;
    const scan = () => {
      if (stopped) return;
      const els = scope.querySelectorAll('.reveal:not(.in), .marker:not(.in), .mask-line:not(.in)');
      if (!els.length) { cleanup(); return; }
      const rr = scope.getBoundingClientRect();
      els.forEach(el => {
        const er = el.getBoundingClientRect();
        const top = Math.max(er.top, rr.top);
        const bot = Math.min(er.bottom, rr.bottom);
        const visible = Math.max(0, bot - top);
        const ratio = er.height ? visible / er.height : 0;
        if (visible > 0 && ratio >= 0.08) el.classList.add('in');
      });
    };
    const cleanup = () => { stopped = true; scope.removeEventListener('scroll', scan); };
    scope.addEventListener('scroll', scan, { passive: true });
    // Multiple scans to catch late-mounted children + post-layout settle
    const ts = [0, 80, 240, 600, 1200].map(d => setTimeout(scan, d));
    return () => { cleanup(); ts.forEach(clearTimeout); };
  }, [root]);
  return null;
}

// ─── style atoms ────────────────────────────────────────────────────────────
const S = {
  section: { padding: '32px 32px' },
  eyebrow: { fontFamily: 'var(--mono)', fontSize: 11, letterSpacing: '.16em', textTransform: 'uppercase', color: 'var(--ink-3)' },
  chip: { padding:'4px 9px', border:'1px solid var(--line-2)', borderRadius: 999, fontSize: 11.5,
          fontFamily:'var(--mono)', color:'var(--ink-2)', background:'var(--bg)' },
  chipSm: { padding:'3px 7px', border:'1px solid var(--line)', borderRadius: 4, fontSize: 10.5,
            fontFamily:'var(--mono)', color:'var(--ink-3)', background:'transparent' },
  btnGhost: { padding:'10px 16px', border:'1px solid var(--ink)', color:'var(--ink)',
              textDecoration:'none', fontSize: 12.5, fontFamily:'var(--mono)',
              letterSpacing:'.04em', background:'transparent' },
};

Object.assign(window, {
  VariationSubtle, VariationEditorial, VariationTechnical, VariationPlayful, VariationPlayPrompt,
});

</script>
<script type="text/babel" data-presets="react">
// app-e.jsx — solo E variant with Dark/Light header toggle
const E_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "speed": "normal",
  "reduceMotion": false
}/*EDITMODE-END*/;
const E_SPEED_MULT = { slow: 0.55, normal: 1, fast: 1.7 };

function ThemeToggle({ theme, onToggle }) {
  const dark = theme === 'dark';
  return (
    <button onClick={onToggle} aria-label="Toggle theme" data-cursor-target
      style={{
        position: 'fixed', top: 18, right: 20, zIndex: 50,
        width: 42, height: 42, borderRadius: '999px',
        border: '1px solid var(--line-2)', background: 'var(--bg)',
        color: 'var(--ink)', cursor: 'pointer', display: 'flex',
        alignItems: 'center', justifyContent: 'center',
        fontFamily: 'var(--mono)', fontSize: 16,
        transition: 'background .35s, color .35s, border-color .35s, transform .25s cubic-bezier(.18,1.4,.4,1)',
        backdropFilter: 'blur(8px)',
      }}
      onMouseEnter={e => e.currentTarget.style.transform = 'scale(1.08) rotate(-12deg)'}
      onMouseLeave={e => e.currentTarget.style.transform = ''}
    >
      <span key={theme} style={{ display: 'inline-block', animation: 'theme-pop .4s cubic-bezier(.2,1.6,.5,1)' }}>
        {dark ? '☾' : '☀'}
      </span>
      <style>{`
        @keyframes theme-pop {
          0% { transform: scale(.4) rotate(-90deg); opacity: 0 }
          100% { transform: scale(1) rotate(0); opacity: 1 }
        }
      `}</style>
    </button>
  );
}

function EApp() {
  const [theme, setTheme] = React.useState(() => {
    try { return localStorage.getItem('ohm-theme') || E_DEFAULTS.theme; } catch (_) { return E_DEFAULTS.theme; }
  });
  const speed = E_DEFAULTS.speed;
  const reduceMotion = E_DEFAULTS.reduceMotion;

  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    document.body.setAttribute('data-rm', reduceMotion ? 'on' : 'off');
    const m = E_SPEED_MULT[speed] || 1;
    window.__SPD__ = m;
    document.documentElement.style.setProperty('--spd-mult', String(m));
    try { localStorage.setItem('ohm-theme', theme); } catch (_) {}
  }, [theme, speed, reduceMotion]);

  return (
    <div style={{
      minHeight: '100vh', background: 'var(--bg)', color: 'var(--ink)',
      transition: 'background .35s, color .35s',
    }}>
      <ThemeToggle theme={theme} onToggle={() => setTheme(theme === 'dark' ? 'light' : 'dark')} />
      <style>{`
        /* Standalone full-width layout — mirrors the original site:
           nav and marquee span full viewport, content sections center at ~720px. */
        .shell-play.standalone > nav { padding-left: clamp(20px, 4vw, 56px); padding-right: clamp(20px, 4vw, 56px); }
        .shell-play.standalone > section { max-width: 760px; margin-left: auto; margin-right: auto;
          padding-left: clamp(20px, 4vw, 32px); padding-right: clamp(20px, 4vw, 32px); }
        /* Marquee section is full-bleed (no max-width) */
        .shell-play.standalone > section.full-bleed { max-width: none; padding-left: 0; padding-right: 0; }
        .shell-play.standalone > footer { max-width: 760px; margin-left: auto; margin-right: auto;
          padding-left: clamp(20px, 4vw, 32px); padding-right: clamp(20px, 4vw, 32px); }
      `}</style>
      <div data-scroll-root className="shell shell-play standalone"
        style={{
          width: '100%', minHeight: '100vh',
          background: 'var(--bg)', color: 'var(--ink)', fontFamily: 'var(--sans)',
          position: 'relative',
        }}>
        <VariationPlayPrompt />
      </div>
      <WindowRevealObserver />
    </div>
  );
}

// In standalone mode the data-scroll-root wrapper doesn't itself scroll —
// the window does. Re-scan reveal targets on window scroll using the viewport.
function WindowRevealObserver() {
  React.useEffect(() => {
    const scope = document.querySelector('.shell-play');
    if (!scope) return;
    let stopped = false;
    const scan = () => {
      if (stopped) return;
      const els = scope.querySelectorAll('.reveal:not(.in), .marker:not(.in), .mask-line:not(.in)');
      const vh = window.innerHeight;
      els.forEach(el => {
        const er = el.getBoundingClientRect();
        const top = Math.max(er.top, 0);
        const bot = Math.min(er.bottom, vh);
        const visible = Math.max(0, bot - top);
        const ratio = er.height ? visible / er.height : 0;
        if (visible > 0 && ratio >= 0.05) el.classList.add('in');
      });
      if (!els.length) cleanup();
    };
    const cleanup = () => { stopped = true; window.removeEventListener('scroll', scan); };
    window.addEventListener('scroll', scan, { passive: true });
    [0, 80, 240, 600, 1200, 2400].forEach(d => setTimeout(scan, d));
    return cleanup;
  }, []);
  return null;
}

// Patch _checkInView so useInView (which finds the data-scroll-root) ALSO
// considers the window viewport — needed when the scroll-root itself isn't
// the scroll container (standalone page).
const _origCheck = window._checkInView;
window._checkInView = function(el, root, threshold = 0.1) {
  if (!el) return false;
  const er = el.getBoundingClientRect();
  const vh = window.innerHeight;
  // Window-relative
  const wTop = Math.max(er.top, 0);
  const wBot = Math.min(er.bottom, vh);
  const wVis = Math.max(0, wBot - wTop);
  const wRatio = er.height ? wVis / er.height : 0;
  if (wRatio >= threshold) return true;
  // Fall through to root-relative
  if (_origCheck) return _origCheck(el, root, threshold);
  return false;
};

ReactDOM.createRoot(document.getElementById('root')).render(<EApp />);

</script>
